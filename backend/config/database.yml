# PostgreSQL Database Configuration

default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  
development:
  <<: *default
  database: zarbin_dev
  # Use local socket connection (peer authentication)
  # This doesn't require a password for local development
  host: localhost
  username: postgres
  # Leave password empty for peer authentication

test:
  <<: *default
  database: zarbin_test
  host: localhost
  username: postgres

production:
  <<: *default
  database: <%= ENV.fetch("DB_NAME", "zarbin_prod") %>
  username: <%= ENV["DB_USER"] %>
  password: <%= ENV["DB_PASSWORD"] %>
  host: <%= ENV["DB_HOST"] %>
  port: <%= ENV.fetch("DB_PORT", 5432) %>
