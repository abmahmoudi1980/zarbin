# .rubocop.yml - Zarbin Backend Linting Configuration

inherit_from:
  - .rubocop_todo.yml

AllCops:
  TargetRubyVersion: 3.4
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "bin/**/*"
    - "config/**/*"
    - "db/migrate/**/*"
    - "db/schema.rb"
    - "vendor/**/*"
    - "node_modules/**/*"
    - ".bundle/**/*"

# Layout
Layout/LineLength:
  Max: 160
  Exclude:
    - "spec/**/*"

Layout/ClassStructure:
  Enabled: true

# Metrics
Metrics/AbcSize:
  Max: 70
  Exclude:
    - "spec/**/*"

Metrics/ClassLength:
  Max: 250

Metrics/MethodLength:
  Max: 45
  Exclude:
    - "spec/**/*"

Metrics/CyclomaticComplexity:
  Max: 10

Metrics/PerceivedComplexity:
  Max: 12

# Naming
Naming/MethodParameterName:
  MinNameLength: 2

Naming/PredicateMethod:
  Enabled: false # Allow validate_* and verify_* methods

# Style
Style/FrozenStringLiteralComment:
  Enabled: false

Style/Documentation:
  Enabled: false

Style/IfUnlessModifier:
  Enabled: true

Style/NumericLiterals:
  Enabled: false

# Disabled Cops for pragmatic development
Lint/AmbiguousBlockAssociation:
  Enabled: false

Lint/UnusedBlockArgument:
  Enabled: false
