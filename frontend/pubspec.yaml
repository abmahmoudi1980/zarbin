name: zarbin
description: "AI-powered financial advisor for high-inflation economies. Track purchasing power, not just money."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.2.0
  flutter: ^3.16.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.0
  riverpod: ^2.4.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  sqflite: ^2.3.0
  path: ^1.8.3
  path_provider: ^2.1.0

  # HTTP & API
  dio: ^5.3.0
  http: ^1.1.0

  # Security
  flutter_secure_storage: ^9.0.0
  crypto: ^3.0.3

  # Jalali Calendar & Localization
  shamsi_date: any
  persian_datetime_picker: any
  flutter_localizations:
    sdk: flutter
  intl: any
  faker: ^2.1.0

  # UI Components
  get: ^4.6.0
  cached_network_image: ^3.3.1
  fl_chart: ^0.65.0
  shimmer: ^3.0.0
  google_fonts: any
  pie_chart: any
  pull_to_refresh: ^2.0.0

  # Forms & Validation
  reactive_forms: ^16.1.0
  form_builder_validators: any

  # Utilities
  uuid: ^4.0.0
  connectivity_plus: ^5.0.0
  package_info_plus: ^4.2.0
  shared_preferences: ^2.2.0
  url_launcher: ^6.2.0

  # Logging & Analytics (Optional for MVP)
  firebase_core: ^2.24.0
  firebase_analytics: ^10.8.0
  firebase_crashlytics: ^3.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  test: ^1.25.0
  mockito: ^5.4.0
  mocktail: any
  build_runner: ^2.4.0
  hive_generator: ^2.0.1
  riverpod_generator: ^2.3.0

flutter:
  uses-material-design: true
  generate: true

  # Assets
  # assets:
  #   - assets/images/

  # Fonts
  # fonts:
  #   - family: Vazir
  #     fonts:
  #       - asset: assets/fonts/Vazir-Regular.ttf
  #         weight: 400
  #       - asset: assets/fonts/Vazir-Bold.ttf
  #         weight: 700
  #       - asset: assets/fonts/Vazir-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Vazir-Light.ttf
  #         weight: 300

# Flutter configuration
flutter_intl:
  enabled: true
  default_locale: fa
  localization_package_name: flutter_gen/gen_l10n
