# .rubocop.yml - Zarbin Backend Linting Configuration

inherit_from:
  - .rubocop_todo.yml

AllCops:
  TargetRubyVersion: 3.4
  TargetRailsVersion: 8.0
  Exclude:
    - "bin/**/*"
    - "config/**/*"
    - "db/migrate/**/*"
    - "db/schema.rb"
    - "vendor/**/*"
    - "node_modules/**/*"
    - ".bundle/**/*"

# Layout
Layout/LineLength:
  Max: 120
  Exclude:
    - "spec/**/*"

Layout/ClassStructure:
  Enabled: true

# Metrics
Metrics/AbcSize:
  Max: 25
  Exclude:
    - "spec/**/*"

Metrics/ClassLength:
  Max: 250

Metrics/MethodLength:
  Max: 20
  Exclude:
    - "spec/**/*"

Metrics/CyclomaticComplexity:
  Max: 10

Metrics/PerceivedComplexity:
  Max: 12

# Naming
Naming/MethodParameterName:
  MinNameLength: 2

# RSpec
RSpec/ExampleLength:
  Max: 50

RSpec/DescribeClass:
  Enabled: false

RSpec/MultipleDescribes:
  Enabled: false

# Rails
Rails/Output:
  Enabled: false

Rails/SaveBang:
  Enabled: false

# Style
Style/FrozenStringLiteralComment:
  Enabled: false

Style/Documentation:
  Enabled: false

Style/IfUnlessModifier:
  Enabled: true
  MaxLineLength: 120

Style/NumericLiterals:
  Enabled: false

# Disabled Cops for pragmatic development
Lint/AmbiguousBlockAssociation:
  Enabled: false

Lint/UnusedBlockArgument:
  Enabled: false
